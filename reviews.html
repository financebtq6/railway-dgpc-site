  <script>

    // Initialize AOS

    AOS.init({

      duration: 800,

      easing: 'ease-in-out',

      once: true

    });



    // Initialize Vanta.js

    if (window.VANTA) {

      VANTA.NET({

        el: "#vanta-bg",

        mouseControls: true,

        touchControls: true,

        gyroControls: false,

        minHeight: 200.00,

        minWidth: 200.00,

        scale: 1.00,

        scaleMobile: 1.00,

        color: 0x3b82f6,

        backgroundColor: 0x111827,

        points: 12.00,

        maxDistance: 23.00,

        spacing: 15.00

      });

    }



    // Language menu toggle

    const langBtn = document.getElementById('language-menu');

    if (langBtn) {

      langBtn.addEventListener('click', function (e) {

        e.preventDefault();

        const menu = this.nextElementSibling;

        if (menu && menu.classList.contains('hidden')) {

          menu.classList.remove('hidden');

        } else if (menu) {

          menu.classList.add('hidden');

        }

      });

    }



    // Initial icon replace

    if (window.feather) feather.replace();

  </script>
