<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Вхід — Digital PC Admin</title>
  <link rel="stylesheet" href="./admin.css">
</head>
<body>
  <div class="admin-shell">
    <div class="admin-login-wrap">
      <div class="admin-login-card">
        <h1 class="admin-login-title">Digital PC <span class="admin-accent">Admin</span></h1>
        <p class="admin-login-subtitle">Вхід до адмін-панелі</p>

        <p class="admin-error" id="admin-login-error" hidden></p>

        <form id="admin-login-form" novalidate>
          <div class="admin-field">
            <label for="admin-email">Email</label>
            <input type="email" id="admin-email" name="email" autocomplete="username" required>
          </div>
          <div class="admin-field">
            <label for="admin-password">Пароль</label>
            <input type="password" id="admin-password" name="password" autocomplete="current-password" required>
          </div>
          <button type="submit" class="admin-btn admin-btn-primary" id="admin-login-submit">Увійти</button>
        </form>
      </div>
    </div>
  </div>

  <script src="./admin.js"></script>
</body>
</html>
