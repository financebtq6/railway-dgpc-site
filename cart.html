<head>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/i18next@21.6.10/dist/umd/i18next.min.js"></script>

    <style>
        /* Dark-blue gradient header animation */
        .page-header-animated {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%) !important;
            position: relative;
            overflow: hidden;
        }
        .page-header-animated::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at center, rgba(59,130,246,0.15) 0%, transparent 60%);
            animation: headerGlow 4s ease-in-out infinite;
        }
        .page-header-float {
            animation: headerFloat 3s ease-in-out infinite;
            display: inline-block;
        }
        @keyframes headerGlow {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.5; }
            50% { transform: translate(20px, 10px) scale(1.1); opacity: 1; }
        }
        @keyframes headerFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
    </style>

    <link rel="stylesheet" href="./css/site.css">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-D3PDY8Z9JG">
    </script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-D3PDY8Z9JG');
    </script>
</head>

<body class="antialiased flex flex-col min-h-screen">

    <!-- Navigation -->
    <nav class="bg-white bg-opacity-90 backdrop-filter backdrop-blur-lg shadow-sm fixed w-full z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <!-- Logo -->
                <div class="flex-shrink-0 flex items-center"><a href="index.html" class="flex items-center"><img
                            src="./images/digitalpc-logo-hero.png" alt="Digital PC Logo" class="navbar-logo"></a></div>

                <!-- Desktop Menu -->
                <div class="hidden md:ml-6 md:flex md:space-x-8">
                    <a href="index.html"
                        class="nav-link text-gray-500 hover:text-gray-900 inline-flex items-center px-1 pt-1 text-sm font-medium"
                        data-i18n="nav_home">Головна</a>
                    <a href="computers.html"
                        class="nav-link text-gray-500 hover:text-gray-900 inline-flex items-center px-1 pt-1 text-sm font-medium"
                        data-i18n="nav_catalog">Комп'ютери</a>
                    <a href="periphery.html"
                        class="nav-link text-gray-500 hover:text-gray-900 inline-flex items-center px-1 pt-1 text-sm font-medium"
                        data-i18n="nav_periphery">Периферія</a>
                    <a href="warranty.html"
                        class="nav-link text-gray-500 hover:text-gray-900 inline-flex items-center px-1 pt-1 text-sm font-medium"
                        data-i18n="nav_warranty">Гарантія</a>
                    <a href="reviews.html"
                        class="nav-link text-gray-500 hover:text-gray-900 inline-flex items-center px-1 pt-1 text-sm font-medium"
                        data-i18n="nav_reviews">Відгуки</a>
                    <a href="about.html"
                        class="nav-link text-gray-500 hover:text-gray-900 inline-flex items-center px-1 pt-1 text-sm font-medium"
                        data-i18n="nav_about">Про нас</a>
                    <a href="contacts.html"
                        class="nav-link text-gray-500 hover:text-gray-900 inline-flex items-center px-1 pt-1 text-sm font-medium"
                        data-i18n="nav_contacts">Контакти</a>
                </div>

                <!-- Right Side -->
                <div class="flex items-center">
                    <!-- Cart & Favorites (desktop) -->
                    <div class="hidden md:flex items-center gap-2 mr-3">
                        <a href="favorites.html" class="dpc-nav-icon-btn" aria-label="Обране">
                            <i data-feather="heart"></i>
                            <span class="dpc-nav-badge dpc-fav-badge" style="display:none;">0</span>
                        </a>
                        <a href="cart.html" class="dpc-nav-icon-btn" aria-label="Кошик">
                            <i data-feather="shopping-cart"></i>
                            <span class="dpc-nav-badge dpc-cart-badge" style="display:none;">0</span>
                        </a>
                    </div>
                    <!-- Mobile menu button -->
                    <div class="-mr-2 flex items-center md:hidden"><button type="button"
                            class="inline-flex items-center justify-center p-2 rounded-md text-gray-400 hover:text-gray-500 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-blue-500"
                            aria-expanded="false" id="mobile-menu-button"><span class="sr-only">Open main menu</span><i
                                data-feather="menu" class="block h-6 w-6"></i></button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Mobile menu -->
        <div class="md:hidden hidden" id="mobile-menu">
            <div class="pt-2 pb-3 space-y-1"><a href="index.html"
                    class="border-transparent text-gray-600 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-800 block pl-3 pr-4 py-2 border-l-4 text-base font-medium">Головна</a><a
                    href="computers.html"
                    class="border-transparent text-gray-600 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-800 block pl-3 pr-4 py-2 border-l-4 text-base font-medium">Комп'ютери</a>
                <a href="periphery.html"
                    class="border-transparent text-gray-600 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-800 block pl-3 pr-4 py-2 border-l-4 text-base font-medium">Периферія</a>
                <a href="warranty.html"
                    class="border-transparent text-gray-600 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-800 block pl-3 pr-4 py-2 border-l-4 text-base font-medium">Гарантія</a>
                <a href="reviews.html"
                    class="border-transparent text-gray-600 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-800 block pl-3 pr-4 py-2 border-l-4 text-base font-medium">Відгуки</a>
                <a href="about.html"
                    class="border-transparent text-gray-600 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-800 block pl-3 pr-4 py-2 border-l-4 text-base font-medium">Про нас</a><a href="contacts.html"
                    class="border-transparent text-gray-600 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-800 block pl-3 pr-4 py-2 border-l-4 text-base font-medium">Контакти</a>
                <div class="dpc-mobile-menu-sep"></div>
                <a href="favorites.html"
                    class="dpc-mobile-action-link border-transparent text-gray-600 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-800 block pl-3 pr-4 py-2 border-l-4 text-base font-medium">
                    <i data-feather="heart" class="w-4 h-4"></i> Обране
                    <span class="dpc-nav-badge dpc-fav-badge" style="display:none;">0</span>
                </a>
                <a href="cart.html"
                    class="dpc-mobile-action-link border-transparent text-gray-600 hover:bg-gray-50 hover:border-gray-300 hover:text-gray-800 block pl-3 pr-4 py-2 border-l-4 text-base font-medium">
                    <i data-feather="shopping-cart" class="w-4 h-4"></i> Кошик
                    <span class="dpc-nav-badge dpc-cart-badge" style="display:none;">0</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Header -->
    <div class="bg-gray-900 pt-32 pb-12 page-header-animated">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <h1 class="text-4xl font-bold text-white mb-4 title-font page-header-float">Кошик</h1>
        </div>
    </div>

    <!-- Content -->
    <div class="flex-grow max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
        <div id="dpc-cart-root">
            <!-- Rendered by cart.js -->
        </div>

        <div id="dpc-cart-summary" class="dpc-cart-summary" style="display:none;">
            <div class="dpc-cart-summary-row">
                <span>Сума замовлення</span>
                <span id="dpc-cart-total-value">0 ₴</span>
            </div>
            <button type="button" id="dpc-checkout-toggle-btn" onclick="window.dpcOpenCheckoutForm()"
                class="w-full font-bold py-4 px-6 rounded-2xl transition-all flex items-center justify-center text-lg dpc-btn-order">
                <i data-feather="check-circle" class="w-5 h-5 mr-2"></i> Оформити заявку
            </button>
        </div>

        <div id="dpc-checkout-form-wrap" class="dpc-checkout-form-wrap" style="display:none;">
            <form id="dpc-checkout-form" class="dpc-checkout-form" novalidate>
                <h3 class="dpc-checkout-title">Оформлення заявки</h3>

                <div class="dpc-form-field">
                    <label for="checkout-name">Ім'я *</label>
                    <input type="text" id="checkout-name" name="name" required placeholder="Ваше ім'я">
                </div>
                <div class="dpc-form-field">
                    <label for="checkout-phone">Телефон *</label>
                    <input type="tel" id="checkout-phone" name="phone" required placeholder="+380 XX XXX XX XX">
                </div>
                <div class="dpc-form-field">
                    <label for="checkout-city">Місто *</label>
                    <input type="text" id="checkout-city" name="city" required placeholder="Ваше місто">
                </div>
                <div class="dpc-form-field">
                    <label for="checkout-warehouse">Відділення Нової Пошти *</label>
                    <input type="text" id="checkout-warehouse" name="warehouse" required placeholder="Наприклад: Відділення №5">
                </div>
                <div class="dpc-form-field">
                    <label for="checkout-payment">Спосіб оплати *</label>
                    <select id="checkout-payment" name="payment" required>
                        <option value="" disabled selected>Оберіть спосіб оплати</option>
                        <option value="Передоплата">Передоплата</option>
                        <option value="Накладний платіж Нова Пошта">Накладний платіж Нова Пошта</option>
                        <option value="Оплата частинами">Оплата частинами</option>
                        <option value="Потрібна консультація">Потрібна консультація</option>
                    </select>
                </div>
                <div class="dpc-form-field">
                    <label for="checkout-comment">Коментар до замовлення</label>
                    <textarea id="checkout-comment" name="comment" rows="3" placeholder="Додаткова інформація (необов'язково)"></textarea>
                </div>

                <div id="dpc-checkout-error" class="dpc-checkout-message dpc-checkout-message--error" style="display:none;"></div>
                <div id="dpc-checkout-success" class="dpc-checkout-message dpc-checkout-message--success" style="display:none;"></div>

                <div class="dpc-checkout-actions">
                    <button type="submit" id="dpc-checkout-submit-btn"
                        class="w-full font-bold py-4 px-6 rounded-2xl transition-all flex items-center justify-center text-lg dpc-btn-order">
                        <i data-feather="send" class="w-5 h-5 mr-2"></i> Відправити заявку
                    </button>
                    <button type="button" onclick="window.dpcCloseCheckoutForm()" class="dpc-checkout-cancel">
                        Скасувати
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <div id="site-platforms-root"></div>
<div id="site-footer-root"></div>
    <script src="js/site-config.js"></script>
    <script src="js/site-footer.js"></script>

    <script src="js/img-fallback.js"></script>
    <script src="js/products-loader.js"></script>
    <script src="cart.js" defer></script>
    <script src="app.js" defer></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (window.feather) feather.replace();
        });
    </script>

</body>

</html>
