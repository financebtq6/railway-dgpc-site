        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700&display=swap');
        :root {
            --primary: #00a8ff;
            --secondary: #0097e6;
            --accent: #00d2d3;
            --dark: #2f3640;
            --light: #f5f6fa;
        }
        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #f8f9fa;
            color: var(--dark);
            overflow-x: hidden;
        }
        .title-font {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
        }
        .product-card {
            background: white;
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }
        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 16px rgba(0, 168, 255, 0.3);
        }
        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 12px;
        }
    
        /* Dark-blue gradient header animation */
        .page-header-animated {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%) !important;
            position: relative;
            overflow: hidden;
        }
        .page-header-animated::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at center, rgba(59,130,246,0.15) 0%, transparent 60%);
            animation: headerGlow 4s ease-in-out infinite;
        }
        .page-header-float {
            animation: headerFloat 3s ease-in-out infinite;
            display: inline-block;
        }
        @keyframes headerGlow {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.5; }
            50% { transform: translate(20px, 10px) scale(1.1); opacity: 1; }
        }
        @keyframes headerFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
    </style>
